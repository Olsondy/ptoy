name: PR guards

# 确定性红线，只做机器能判定的事；语义审查交给人和 Codex。
on:
  pull_request:

permissions:
  contents: read

env:
  # 单个新增文件的体积上限；超过基本可以确定是二进制素材误入。
  MAX_FILE_BYTES: 5242880
  # 本次 PR 新增文件的合计上限；素材常常是一堆小文件凑成大体积。
  MAX_TOTAL_BYTES: 5242880

jobs:
  large-files:
    name: 新增文件体积
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail when new files exceed the size budget
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # checkout 在 PR 上只拉 refs/pull/N/merge，这里显式建出 origin/<base>，
          # 否则 merge-base 拿不到值，检查会静默通过。
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          base=$(git merge-base "origin/$BASE_REF" HEAD)
          if [ -z "$base" ]; then
            echo "::error::找不到 origin/$BASE_REF 与 HEAD 的公共祖先"
            exit 1
          fi

          # 用变量接住 diff 输出：命令失败时 set -e 才会生效（进程替换里的失败会被吞掉）。
          added=$(git diff --name-only --diff-filter=A "$base" HEAD)
          if [ -z "$added" ]; then
            echo "本次没有新增文件"
            exit 0
          fi

          total=0
          oversized=0
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            [ -f "$path" ] || continue
            size=$(wc -c < "$path")
            total=$((total + size))
            if [ "$size" -gt "$MAX_FILE_BYTES" ]; then
              printf '单文件超限: %s  %s bytes\n' "$path" "$size"
              oversized=1
            fi
          done <<< "$added"

          printf '本次 PR 新增文件合计: %s bytes（上限 %s）\n' "$total" "$MAX_TOTAL_BYTES"

          if [ "$oversized" -ne 0 ]; then
            echo "::error::有新增文件超过 $MAX_FILE_BYTES bytes。素材与音视频走外部目录，不进 Git（见 AGENTS.md）。"
            exit 1
          fi
          if [ "$total" -gt "$MAX_TOTAL_BYTES" ]; then
            echo "::error::新增文件合计 $total bytes，超过 $MAX_TOTAL_BYTES bytes。素材与音视频走外部目录，不进 Git（见 AGENTS.md）。"
            exit 1
          fi
          echo "新增文件体积在预算内"
