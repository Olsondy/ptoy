name: Deploy HK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'bench/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'CONTEXT.md'
  workflow_dispatch:

concurrency:
  group: deploy-hk
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Run deploy/cloud/hk/update.sh on HK
        env:
          SSH_KEY: ${{ secrets.HK_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HK_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hk_deploy && chmod 600 ~/.ssh/hk_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key's forced command on the server runs update.sh; nothing else is allowed.
          ssh -i ~/.ssh/hk_deploy -o BatchMode=yes -o ServerAliveInterval=30 root@38.55.199.239
